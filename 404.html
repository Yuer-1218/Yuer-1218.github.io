<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>404 — Page not found</title>
    <style>
        :root {
            --plum: #701e5e;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 30% 20%, #fbf7fa, #ece2e9);
            color: #3a2233;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .box {
            max-width: 480px;
            padding: 2rem;
        }

        h1 {
            font-size: 5.5rem;
            margin: 0;
            color: var(--plum);
            letter-spacing: 0.12em;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
        }

        a.btn {
            display: inline-block;
            margin-top: 1.2rem;
            padding: 0.55rem 1.4rem;
            border-radius: 8px;
            background: var(--plum);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        a.btn:hover {
            opacity: 0.9;
        }

        .cat {
            font-size: 3rem;
            margin-bottom: 0.4rem;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="cat">🐱</div>
        <h1>404</h1>
        <p>This page wandered off. It may have been moved, or it never existed.</p>
        <a class="btn" href="https://yuer-1218.github.io/">Back to the homepage</a>
    </div>
</body>

</html>
